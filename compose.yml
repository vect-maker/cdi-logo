services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localhost/icd-voting-backend:dev
    container_name: icd-voting-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:z
    security_opt:
      - label=disable
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:4173","http://127.0.0.1:5173"]
    restart: unless-stopped
