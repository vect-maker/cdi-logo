[project]
name = "icd-voting-backend"
version = "0.1.0"
description = "FastAPI backend for ICD University Logo Voting Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "libsql>=0.1.11",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.48",
]

[tool.uv]
package = false

[tool.basedpyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"
reportCallInDefaultInitializer = "none"

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]
